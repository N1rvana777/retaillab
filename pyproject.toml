[project]
name = "retaillab"
version = "0.1.0"
description = "Smart Replenishment & Inventory Hedging System for Chain Supermarkets"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "n1rva", email = "277094816+N1rvana777@users.noreply.github.com" }]

dependencies = [
    # Core math
    "numpy>=1.26",
    "scipy>=1.12",
    # ML forecasting
    "xgboost>=2.0",
    "lightgbm>=4.0",
    # Data processing
    "pandas>=2.1",
    "pyarrow>=14",
    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # Cache / Rate limiting
    "redis>=5.0",
    # Visualization (notebooks)
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data_pipeline*", "quant_engine*", "api_gateway*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
